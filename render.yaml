services:
  - type: web
    name: cropdiag-ai
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: gunicorn --bind 0.0.0.0:$PORT --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
